{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-info">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0">
                    <i class="fas fa-sign-in-alt"></i> Staff Login
                </h4>
                <p class="mb-0">Access restricted to authorized personnel</p>
            </div>
            <div class="card-body">
                <div class="alert alert-light border">
                    <small class="text-muted">
                        <i class="fas fa-shield-alt"></i> 
                        <strong>Secure Access:</strong> This login is for teaching staff and administrators only.
                    </small>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label for="user_type" class="form-label">Login As:</label>
                        <select class="form-select" id="user_type" name="user_type" required>
                            <option value="">Select Role</option>
                            <option value="teacher" {% if request.args.get('type') == 'teacher' %}selected{% endif %}>
                                Teacher
                            </option>
                            <option value="admin" {% if request.args.get('type') == 'admin' %}selected{% endif %}>
                                HOD/Administrator
                            </option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required 
                               placeholder="Enter your registered email">
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required 
                               placeholder="Enter your password">
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-info text-white">
                            <i class="fas fa-lock-open"></i> Login to Portal
                        </button>
                    </div>
                </form>
                
                <div class="mt-3 text-center">
                    <p>Don't have an account? 
                        <a href="{{ url_for('portal.portal_signup') }}?type=teacher" class="text-decoration-none">
                            Register here
                        </a>
                    </p>
                    <div class="d-grid gap-2">
                        <a href="{{ url_for('portal.portal_home') }}" class="btn btn-outline-secondary btn-sm">
                            <i class="fas fa-arrow-left"></i> Back to Portal
                        </a>
                        <a href="{{ url_for('main.index') }}" class="btn btn-outline-primary btn-sm">
                            <i class="fas fa-home"></i> Main Website
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Pre-fill user type from URL parameter
document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type');
    if (type) {
        document.getElementById('user_type').value = type;
    }
});
</script>
{% endblock %}
